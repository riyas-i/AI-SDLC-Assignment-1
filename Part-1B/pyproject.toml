[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense"
version = "0.1.0"
description = "Expense Claim Assistant: turns free-text expense descriptions into structured, policy-checked claims."
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
    "jsonschema",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
expense = "expense.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src", ".harness"]
testpaths = ["tests"]
