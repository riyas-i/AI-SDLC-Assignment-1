[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-todo"
version = "1.0.0"
description = "Smart Todo CLI: a single-user terminal todo manager."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "bandit", "pytest", "pytest-cov"]

[project.scripts]
todo = "todo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
